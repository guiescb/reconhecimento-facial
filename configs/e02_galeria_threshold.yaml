experiment_id: E02
hypothesis: >
  H1: calibrar o threshold no conjunto aberto da validacao (alvo de FAR para desconhecidos)
  reduz a taxa de desconhecidos aceitos em relacao ao threshold de EER por pares usado no E01
  (5.48%), com uma pequena perda na identificacao correta de pessoas conhecidas.
  H2: guardar as fotos de cadastro separadas (vizinho mais proximo) em vez da media (prototipo)
  nao traz ganho claro, porque os embeddings do FaceNet de uma mesma pessoa ja sao compactos.
seed: 42
dataset:
  name: lfw
  min_faces_per_person: 10
  crop: 144
  image_size: 160
model:                      # so usado se o cache de embeddings do E01 nao existir
  name: facenet_inception_resnet_v1
  pretrained: vggface2
  batch_size: 32
  device: cpu
embeddings_cache: data/cache/E01_vggface2_crop144.npz   # os mesmos embeddings do E01
split:
  fractions: [0.6, 0.2, 0.2]   # identico ao E01 (por IDENTIDADE)
pairs:
  n_val_pairs: 4000            # so para reproduzir o threshold de EER por pares do E01
open_set:
  n_enroll: 3
  known_fraction: 0.5
  gallery_methods: [prototype, nearest]
  far_targets: [0.05, 0.02, 0.01]   # alvos de desconhecidos aceitos, definidos antes de ver o teste
  primary_far_target: 0.01          # ponto de operacao principal, tambem definido a priori
  n_calibration_repeats: 20
output_dir: results
